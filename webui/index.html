    <meta name="theme-color" content="#070B12" />
    <!-- Apply the persisted theme before first paint (no flash). The
         toggle itself lives in the app header; default is light. -->
    <script>
      try {
        if (localStorage.getItem("pt-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
        } else {
          document.documentElement.style.colorScheme = "light";
        }
        var accent = localStorage.getItem("pt-accent");
        if (accent && accent !== "crimson") {
          document.documentElement.dataset.accent = accent;
        }
        var lang = localStorage.getItem("ptk-lang");
        if (lang) {
          document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
          if (lang === "ar") document.documentElement.dir = "rtl";
        }
      } catch (e) {}
    </script>
