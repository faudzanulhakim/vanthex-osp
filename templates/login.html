  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #0B1120;
      --bg-gradient: radial-gradient(circle at 50% 0%, rgba(37,99,235,0.15) 0%, rgba(11,17,32,0) 70%), #0B1120;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      --fg: #F1F5F9;
      --fg-muted: #94A3B8;
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --input-bg: rgba(15, 23, 42, 0.8);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus: #3B82F6;
      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-border: rgba(239, 68, 68, 0.3);
      --badge-bg: rgba(59, 130, 246, 0.15);
      --badge-border: rgba(59, 130, 246, 0.3);
    }

    html[data-theme="light"] {
      --bg: #F8FAFC;
      --bg-gradient: radial-gradient(circle at 50% 0%, rgba(59,130,246,0.12) 0%, rgba(248,250,252,0) 70%), #F8FAFC;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(226, 232, 240, 0.9);
      --card-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(0,0,0,0.05);
      --fg: #0F172A;
      --fg-muted: #58667C;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-glow: rgba(37, 99, 235, 0.25);
      --input-bg: #FFFFFF;
      --input-border: #CBD5E1;
      --input-focus: #2563EB;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --danger-border: #FCA5A5;
      --badge-bg: rgba(37, 99, 235, 0.08);
      --badge-border: rgba(37, 99, 235, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      color: var(--fg);
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Ambient cyber grid pattern */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(var(--card-border) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.6;
      pointer-events: none;
      z-index: 0;
    }

    .top-controls {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .ctrl-btn, .lang-select {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      color: var(--fg-muted);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      outline: none;
    }

    .ctrl-btn:hover, .lang-select:hover {
      color: var(--fg);
      border-color: var(--accent);
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 40px 36px 32px;
      box-shadow: var(--card-shadow);
      animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .mark-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent) 0%, #1E40AF 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px var(--accent-glow);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .mark-icon::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom right, rgba(255,255,255,0.25), transparent);
      pointer-events: none;
    }

    .mark-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--fg);
      margin-bottom: 6px;
    }

    .muted {
      color: var(--fg-muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .tag-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--accent);
      border-radius: 12px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--fg-muted);
      margin-bottom: 7px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 17px;
      height: 17px;
      color: var(--fg-muted);
      pointer-events: none;
      stroke-width: 2;
    }

    input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--fg);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--fg-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      width: auto;
      margin-top: 0;
    }

    .toggle-pw:hover {
      color: var(--fg);
    }

    .toggle-pw svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    button#b {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent) 0%, #1D4ED8 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button#b:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
      filter: brightness(1.08);
    }

    button#b:active:not(:disabled) {
      transform: translateY(0);
    }

    button#b:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .err {
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 8px;
      font-size: 13px;
      margin-top: 14px;
      padding: 10px 14px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: shake 0.35s ease;
    }

    .err.show {
      display: flex;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    button#b.loading .spinner {
      display: inline-block;
    }

    .foot {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--card-border);
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--danger);
      font-weight: 700;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .foot svg {
      width: 13px;
      height: 13px;
      stroke-width: 2.2;
    }
  
    /* ==== POLISH PASS v1.0.0 — refinement layer (visual only) ==== */
    ::selection { background: var(--accent); color: #fff; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    body { -webkit-font-smoothing: antialiased;
           background-image: radial-gradient(900px 480px at 15% -10%, var(--accent-glow, rgba(37,99,235,0.20)), transparent 60%),
                             radial-gradient(700px 420px at 110% 110%, var(--accent-glow, rgba(37,99,235,0.20)), transparent 55%); }
    .card { box-shadow: 0 24px 48px -16px rgba(2, 6, 23, 0.25), 0 4px 12px -4px rgba(2, 6, 23, 0.12);
            backdrop-filter: saturate(1.2); }
    .input-wrapper input { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
    .input-wrapper input:focus { box-shadow: 0 0 0 3px var(--accent-glow, rgba(37,99,235,0.20)); }
    .btn { transition: transform 0.1s ease, box-shadow 0.15s ease, background 0.15s ease; }
    .btn:active { transform: translateY(1px); }
    .ctrl-btn, .lang-select { transition: background 0.15s ease, border-color 0.15s ease; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  
    /* ==== MODERN PASS v1.0.0 — elevation layer (visual only) ==== */
    .mark-icon { background: linear-gradient(135deg, var(--accent), var(--accent2, #1D4ED8));
            box-shadow: 0 12px 26px -10px var(--accent-glow, rgba(37,99,235,0.45)),
                        inset 0 1px 0 rgba(255,255,255,0.28); }
    body { animation: ptkBg 16s ease-in-out infinite alternate; }
    @keyframes ptkBg { from { background-position: 0% 0%, 100% 100%; }
                       to   { background-position: 8% 4%, 92% 96%; } }
    .card { border: 1px solid var(--border, #E2E8F0); border-radius: 18px; }
    .btn.primary, button[type="submit"] { background: linear-gradient(180deg, var(--accent), var(--accent2, #1D4ED8));
            box-shadow: 0 12px 24px -10px var(--accent-glow, rgba(37,99,235,0.45)),
                        inset 0 1px 0 rgba(255,255,255,0.22); }
    .tag-badge { letter-spacing: 1.6px; box-shadow: inset 0 0 0 1px var(--border, #E2E8F0); }
  
    /* ==== CYBER PASS v1.2.0 — security command-center theme (visual only) ==== */
    :root { --accent: #0284C7; --accent2: #2563EB; --accent-glow: rgba(2, 132, 199, 0.40); }
    html[data-theme="dark"] { --bg: #030509; --card: #0A101E; --accent: #22D3EE; --accent2: #3B82F6;
      --accent-glow: rgba(34, 211, 238, 0.50); --border: rgba(56, 189, 248, 0.22); }
    body {
      background-image:
        radial-gradient(680px 340px at 10% -8%, rgba(34, 211, 238, 0.20), transparent 62%),
        radial-gradient(820px 420px at 95% 112%, rgba(37, 99, 235, 0.22), transparent 62%),
        linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
      background-size: auto, auto, 44px 44px, 44px 44px;
    }
    .card {
      background: color-mix(in srgb, var(--card) 90%, transparent);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
      box-shadow: 0 30px 60px -25px rgba(0, 0, 0, 0.65), 0 0 44px -14px var(--accent-glow),
                  inset 0 1px 0 rgba(255, 255, 255, 0.10);
    }
    .mark-icon {
      background: linear-gradient(135deg, #22D3EE, #2563EB); color: #ECFEFF;

                  inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    .btn.primary, button[type="submit"] {
      background: linear-gradient(135deg, #06B6D4, #2563EB);
      box-shadow: 0 14px 28px -10px var(--accent-glow), 0 0 0 1px rgba(34, 211, 238, 0.35),
                  inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .tag-badge { border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      color: var(--accent); box-shadow: 0 0 16px -6px var(--accent-glow),
      inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
    @media (prefers-reduced-motion: no-preference) {
      .mark-icon { animation: ptkPulse 3.2s ease-in-out infinite; }
      @keyframes ptkPulse { 0%, 100% { box-shadow: 0 0 0 1px rgba(34,211,238,.5), 0 14px 30px -10px var(--accent-glow), 0 0 22px -6px var(--accent-glow); }
                            50% { box-shadow: 0 0 0 1px rgba(34,211,238,.7), 0 14px 30px -10px var(--accent-glow), 0 0 38px -4px var(--accent-glow); } }
    }


    /* ==== DARK OPS PASS v1.3.0 — red-team theme (visual only) ==== */
    :root { --accent: #DC2626; --accent2: #EA580C; --accent-glow: rgba(220, 38, 38, 0.38); }
    html[data-theme="dark"] { --bg: #010202; --card: #07090C; --accent: #FF2D40; --accent2: #FF7A18;
      --accent-glow: rgba(255, 45, 64, 0.55); --border: rgba(255, 45, 64, 0.28); }
    body {
      background-image:
        radial-gradient(680px 340px at 10% -8%, rgba(255, 45, 64, 0.17), transparent 62%),
        radial-gradient(820px 420px at 95% 112%, rgba(255, 122, 24, 0.12), transparent 62%),
        linear-gradient(rgba(255, 45, 64, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 45, 64, 0.05) 1px, transparent 1px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.02) 0 1px, transparent 1px 3px);
      background-size: auto, auto, 44px 44px, 44px 44px, auto;
    }
    body::after { content: ""; position: fixed; left: 0; right: 0; top: 0; height: 150px;
      pointer-events: none; z-index: 1;
      background: linear-gradient(180deg, transparent, rgba(255, 45, 64, 0.06), transparent); }
    @media (prefers-reduced-motion: no-preference) {
      body::after { animation: ptkSweep 9s linear infinite; }
      @keyframes ptkSweep { from { transform: translateY(-30vh); } to { transform: translateY(120vh); } }
    }
    .card {
      background: rgba(5, 6, 8, 0.88);
      border: 1px solid rgba(255, 45, 64, 0.38);
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
      box-shadow: none; filter: drop-shadow(0 26px 44px rgba(255, 45, 64, 0.20));
    }
    html[data-theme="light"] .card, html:not([data-theme="dark"]) .card { background: color-mix(in srgb, var(--card) 92%, transparent); }
    .mark-icon { background: linear-gradient(135deg, #FF2D40, #FF7A18); color: #FFF7ED;
      box-shadow: 0 0 0 1px rgba(255, 45, 64, 0.55), 0 14px 30px -10px rgba(255, 45, 64, 0.55),
                  0 0 30px -6px rgba(255, 45, 64, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
    .btn.primary, button[type="submit"] {
      background: linear-gradient(135deg, #FF2D40, #FF7A18); color: #FFF7ED;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
      box-shadow: none; filter: drop-shadow(0 10px 18px rgba(255, 45, 64, 0.40));
    }


    /* ==== HUD PASS v1.4.0 — tactical command interface (visual only) ==== */
    .card { position: relative; }
    .card::after { content: ""; position: absolute; inset: 8px; pointer-events: none; opacity: 0.9;
      background:
        linear-gradient(#FF2D40, #FF2D40) left top / 16px 2px,
        linear-gradient(#FF2D40, #FF2D40) left top / 2px 16px,
        linear-gradient(#FF2D40, #FF2D40) right top / 16px 2px,
        linear-gradient(#FF2D40, #FF2D40) right top / 2px 16px,
        linear-gradient(#FF2D40, #FF2D40) left bottom / 16px 2px,
        linear-gradient(#FF2D40, #FF2D40) left bottom / 2px 16px,
        linear-gradient(#FF2D40, #FF2D40) right bottom / 16px 2px,
        linear-gradient(#FF2D40, #FF2D40) right bottom / 2px 16px;
      background-repeat: no-repeat; }
    .btn.primary, button[type="submit"] { text-transform: uppercase; letter-spacing: 0.1em; }


    /* ==== REFINE PASS v1.5.0 — tidiness & rhythm (visual only) ==== */
    .card { padding: 34px 34px 28px; }
    input { padding: 11px 13px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .tagline { margin: 14px 0 0; font-size: 12px; letter-spacing: 3px;
      text-transform: uppercase; color: var(--accent); font-weight: 600; }

    /* ==== PREMIUM PASS v1.7.0 — enterprise restraint (visual only) ==== */
    :root { --accent: #D92736; --accent2: #FF4148; --accent-glow: rgba(217, 39, 54, 0.30); }
    html[data-theme="dark"] { --bg: #070B12; --card: #0D1520; --accent: #FF4148; --accent2: #D92736;
      --accent-glow: rgba(255, 65, 72, 0.35); --border: #202D3D; }
    body { background-image: radial-gradient(900px 460px at 50% -10%, rgba(255, 65, 72, 0.07), transparent 65%); }
    body::after { display: none; }
    .card { clip-path: none; border-radius: 16px; filter: none;
      border: 1px solid #202D3D; background: #0D1520;
      box-shadow: 0 30px 60px -25px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255,255,255,0.06); }
    html[data-theme="light"] .card, html:not([data-theme="dark"]) .card { background: #FFFFFF; }
    .card::after { display: none; }
    .mark-icon { animation: none; background: linear-gradient(135deg, #FF4148, #D92736);
      box-shadow: 0 10px 22px -10px rgba(255, 65, 72, 0.55), inset 0 1px 0 rgba(255,255,255,0.25); }
    .btn.primary, button[type="submit"] { clip-path: none; border-radius: 10px; filter: none;
      background: linear-gradient(180deg, #FF4148, #D92736);
      box-shadow: 0 10px 20px -10px rgba(255, 65, 72, 0.55), inset 0 1px 0 rgba(255,255,255,0.20);
      text-transform: none; letter-spacing: 0.01em; }

</style>

<style>
/* ============ MOTION PASS v1.11.0 — energetic modern motion ============
   Ambient + state-driven animation layered on the premium token system.
   All motion is decorative/state feedback only; honors reduced-motion. */
:root{ --vx-accent:#FF4148; --vx-accent2:#D92736; }
@keyframes vxDrift{ 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
@keyframes vxRise{ from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:translateY(0)} }
@keyframes vxPulseRing{ 0%{box-shadow:0 0 0 0 rgba(34,201,147,.55)} 70%{box-shadow:0 0 0 9px rgba(34,201,147,0)} 100%{box-shadow:0 0 0 0 rgba(34,201,147,0)} }
@keyframes vxGlow{ 0%,100%{box-shadow:0 0 0 0 rgba(255,65,72,.0), 0 0 14px 0 rgba(255,65,72,.25)} 50%{box-shadow:0 0 0 0 rgba(255,65,72,.0), 0 0 26px 2px rgba(255,65,72,.45)} }
@keyframes vxShimmer{ 0%{background-position:-400px 0} 100%{background-position:400px 0} }
@keyframes vxBarIn{ from{transform:scaleX(0)} to{transform:scaleX(1)} }
@keyframes vxFadeIn{ from{opacity:0} to{opacity:1} }

.card, .stat{ animation:vxRise .55s cubic-bezier(.22,.8,.32,1) both; }
.cards > *:nth-child(1), .stats > *:nth-child(1){ animation-delay:.03s }
.cards > *:nth-child(2), .stats > *:nth-child(2){ animation-delay:.09s }
.cards > *:nth-child(3), .stats > *:nth-child(3){ animation-delay:.15s }
.cards > *:nth-child(4), .stats > *:nth-child(4){ animation-delay:.21s }
.cards > *:nth-child(5), .stats > *:nth-child(5){ animation-delay:.27s }
.cards > *:nth-child(6), .stats > *:nth-child(6){ animation-delay:.33s }

/* stat cards: lift + accent sweep on hover */
.stat{ position:relative; overflow:hidden; transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease; }
.stat::before{ content:""; position:absolute; inset:0 0 auto 0; height:2px;
  background:linear-gradient(90deg, var(--vx-accent), var(--vx-accent2), #43B7F5);
  transform:scaleX(0); transform-origin:left; transition:transform .35s ease; }
.stat:hover{ transform:translateY(-3px); box-shadow:0 14px 30px -12px rgba(0,0,0,.55); }
.stat:hover::before{ transform:scaleX(1); }
.card{ transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease; }
.card:hover{ border-color:rgba(255,65,72,.35); }

/* brand: living glow */
.brand-icon{ animation:vxGlow 3.2s ease-in-out infinite; border-radius:10px; }

/* live indicators: real state, animated */
.live-dot{ animation:vxPulseRing 1.8s ease-out infinite; border-radius:50%; }
.live-scan-pill{ background-image:linear-gradient(110deg, rgba(255,65,72,.16) 30%, rgba(255,65,72,.38) 50%, rgba(255,65,72,.16) 70%);
  background-size:400px 100%; animation:vxShimmer 1.4s linear infinite; }

/* buttons & nav: springy micro-interactions */
button, .btn{ transition:transform .16s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease; }
button:hover, .btn:hover{ transform:translateY(-1px); }
button:active, .btn:active{ transform:translateY(0) scale(.98); }
.sidebar a, .side a, nav a{ transition:background .18s ease, color .18s ease, transform .18s ease; }
.sidebar a:hover, .side a:hover, nav a:hover{ transform:translateX(3px); }

/* tables & lists: rows settle in */
tbody tr{ animation:vxFadeIn .4s ease both; }
tbody tr:nth-child(2){ animation-delay:.04s } tbody tr:nth-child(3){ animation-delay:.08s }
tbody tr:nth-child(4){ animation-delay:.12s } tbody tr:nth-child(5){ animation-delay:.16s }
tbody tr:nth-child(6){ animation-delay:.20s } tbody tr:nth-child(7){ animation-delay:.24s }
tbody tr:nth-child(8){ animation-delay:.28s }

/* progress / severity bars grow from the left */
.progress > *, .bar > *, .sevbar > *{ transform-origin:left; animation:vxBarIn .8s cubic-bezier(.22,.8,.32,1) both; }

/* modals & toasts glide */
.modal, .dialog{ animation:vxRise .3s cubic-bezier(.22,.8,.32,1) both; }
.toast{ animation:vxRise .3s cubic-bezier(.22,.8,.32,1) both; }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
}

/* login backdrop: slow aurora drift in brand colors */
body::before{ content:""; position:fixed; inset:0; z-index:-1;
  background:linear-gradient(120deg, #070B12 0%, #0D1520 30%, rgba(217,39,54,.20) 50%, #0D1520 70%, #070B12 100%);
  background-size:220% 220%; animation:vxDrift 16s ease-in-out infinite; }

  <script>
    const updateThemeUI = () => {
      const isDark = document.documentElement.dataset.theme === 'dark';
      const label = document.getElementById('themeLabel');
      const icon = document.getElementById('themeIcon');
      if (label) label.textContent = loginTr(isDark ? 'Light Mode' : 'Dark Mode');
      if (icon) {
        icon.innerHTML = isDark 
          ? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'
          : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
      }
    };

    function toggleTheme() {
      const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = cur;
      try { localStorage.setItem('ptk-theme', cur); } catch(e) {}
      updateThemeUI();
    }
    updateThemeUI();

    function togglePasswordVisibility() {
      const p = document.getElementById('p');
      const eye = document.getElementById('pwEye');
      if (p.type === 'password') {
        p.type = 'text';
        eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        p.type = 'password';
        eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    const go = async () => {
      const b = document.getElementById('b');
      const errEl = document.getElementById('e');
      const errText = document.getElementById('errText');
      b.disabled = true;
      b.classList.add('loading');
      errEl.classList.remove('show');
      errText.textContent = '';

      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username: u.value, password: p.value})
        });
        if (r.ok) {
          location.href = '/';
        } else {
          errText.textContent = loginTr('Invalid username or password');
          errEl.classList.add('show');
          b.disabled = false;
          b.classList.remove('loading');
        }
      } catch(err) {
        errText.textContent = loginTr('Network or server error occurred');
        errEl.classList.add('show');
        b.disabled = false;
        b.classList.remove('loading');
      }
    };

    document.getElementById('b').onclick = go;
    document.getElementById('p').onkeydown = e => { if (e.key === 'Enter') go(); };
    document.getElementById('u').onkeydown = e => { if (e.key === 'Enter') document.getElementById('p').focus(); };

    function loginTr(s) { try { const L = localStorage.getItem('ptk-lang') || 'en'; const d = LOGIN_I18N[L]; return (d && d[s]) || s; } catch(e) { return s; } }

    function applyLoginI18n(lang) {
      const L = lang || 'en';
      const d = LOGIN_I18N[L];
      document.documentElement.lang = L;
      document.documentElement.dir = L === 'ar' ? 'rtl' : 'ltr';
      const sel = document.getElementById('langSwitch');
      if (sel) sel.value = L;
      if (!d) return;

      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(n => {
        const k = (n.nodeValue || '').trim();
        if (d[k]) n.nodeValue = n.nodeValue.replace(k, d[k]);
      });
      document.querySelectorAll('[placeholder]').forEach(el => {
        const v = el.getAttribute('placeholder');
        if (v && d[v.trim()]) el.setAttribute('placeholder', d[v.trim()]);
      });
      document.querySelectorAll('[title]').forEach(el => {
        if (!el.dataset.origTitle) el.dataset.origTitle = el.getAttribute('title');
        const v = el.dataset.origTitle;
        if (v && d[v.trim()]) el.setAttribute('title', d[v.trim()]);
      });
    }

    function switchLang(l) {
      try { localStorage.setItem('ptk-lang', l); } catch(e) {}
      applyLoginI18n(l);
    }

    (function() {
      let L = 'en';
      try { L = localStorage.getItem('ptk-lang') || 'en'; } catch(e) {}
      applyLoginI18n(L);
    })();
